basePath: /
definitions:
  handlers.signInRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.signInResponse:
    properties:
      email:
        type: string
      expires_in:
        description: seconds until expiry (usually 3600)
        type: string
      token:
        description: 'use as: Authorization: Bearer <token>'
        type: string
      uid:
        type: string
    type: object
info:
  contact: {}
  description: Reusable Go project template using Gin, Firebase Authentication, and
    MongoDB.
  title: gin-golang-firebase-auth-mongodb API
  version: "1.0"
paths:
  /api/v1/auth/me:
    get:
      description: Returns the Firebase UID and claims of the authenticated caller.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /api/v1/auth/token:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges email + password for a Firebase ID token.
        Use the returned value as: Authorization: Bearer <token>
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.signInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.signInResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign in and get a Bearer token
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: Firebase ID token — prefix with "Bearer "
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
