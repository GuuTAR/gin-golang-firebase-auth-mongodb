basePath: /
definitions:
  models.AuthMeResponse:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      name:
        type: string
      picture:
        type: string
      uid:
        type: string
    type: object
  models.AuthSignInRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  models.AuthSignInResponse:
    properties:
      email:
        type: string
      expires_in:
        description: seconds until expiry (usually 3600)
        type: string
      token:
        description: 'use as: Authorization: Bearer <token>'
        type: string
      uid:
        type: string
    type: object
  models.Response:
    properties:
      body: {}
      message:
        type: string
    type: object
  models.ResponseWithoutBody:
    properties:
      message:
        type: string
    type: object
  models.Todo:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_completed:
        type: boolean
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.TodoCreateRequest:
    properties:
      title:
        type: string
    required:
    - title
    type: object
info:
  contact: {}
  description: Reusable Go project template using Gin, Firebase Authentication, and
    MongoDB.
  title: gin-golang-firebase-auth-mongodb API
  version: "1.0"
paths:
  /api/v1/auth/me:
    get:
      description: Returns the Firebase UID and claims of the authenticated caller.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                body:
                  $ref: '#/definitions/models.AuthMeResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /api/v1/auth/signin:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges email + password for a Firebase ID token.
        Use the returned value as: Authorization: Bearer <token>
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AuthSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                body:
                  $ref: '#/definitions/models.AuthSignInResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
      summary: Sign in and get a Bearer token
      tags:
      - auth
  /api/v1/todos:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                body:
                  items:
                    $ref: '#/definitions/models.Todo'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
      security:
      - BearerAuth: []
      summary: List todos
      tags:
      - todos
    post:
      consumes:
      - application/json
      parameters:
      - description: Todo
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.TodoCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                body:
                  $ref: '#/definitions/models.Todo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
      security:
      - BearerAuth: []
      summary: Create a todo
      tags:
      - todos
  /api/v1/todos-reset:
    patch:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
      security:
      - BearerAuth: []
      summary: Reset all todos to not completed
      tags:
      - todos
  /api/v1/todos-toggle/{id}:
    patch:
      parameters:
      - description: Todo ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                body:
                  $ref: '#/definitions/models.Todo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
      security:
      - BearerAuth: []
      summary: Toggle a todo's completed state
      tags:
      - todos
  /api/v1/todos/{id}:
    delete:
      parameters:
      - description: Todo ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
      security:
      - BearerAuth: []
      summary: Delete a todo
      tags:
      - todos
  /health:
    get:
      description: Returns ok when the server is running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResponseWithoutBody'
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Firebase ID token — prefix with "Bearer "
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
