# air — live reload for Go
# Docs: https://github.com/air-verse/air
#
# Platform: Windows
# Linux / macOS → use: air  (default .air.toml)
#
# Usage:
#   air -c .air.windows.toml

root = "."
tmp_dir = "tmp"

[build]
  # Regenerate the Swagger spec from annotations, then build the binary.
  # Windows requires the .exe suffix for cmd.exe to recognise the output as
  # an executable.
  cmd = "swag init -g cmd/server/main.go --parseInternal -o docs && go build -o ./tmp/server.exe ./cmd/server/main.go"
  # Binary air runs after a successful build
  bin = "./tmp/server.exe"
  # Extra args forwarded to the binary (e.g. feature flags)
  args_bin = []
  # File extensions that trigger a rebuild when changed
  include_ext = ["go", "toml", "yaml", "yml", "env"]
  # Directories to watch (relative to root)
  include_dir = ["cmd", "internal", "pkg"]
  # Directories / files to ignore
  exclude_dir   = ["tmp", "vendor", "bin", ".git"]
  exclude_file  = []
  exclude_regex = ["_test\\.go$"]
  # Debounce rapid saves before rebuilding (ms)
  delay = 500
  # Grace period before killing the running process
  kill_delay    = "200ms"
  send_interrupt = true
  # Build-error log
  log = "tmp/build-errors.log"
  stop_on_error = true

[log]
  time      = true
  main_only = false

[color]
  main    = "magenta"
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[misc]
  # Remove tmp dir on exit
  clean_on_exit = true
